<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Pywebview Widget Example</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.6/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            padding: 20px;
        }

        .widget-label {
            display: flex;
            align-items: center;
            min-height: 38px;
        }

        .widget-label-top {
            align-items: flex-start;
            padding-top: 8px;
        }
    </style>
</head>
<body data-bs-theme="light">
<div class="container" style="max-width: 400px;">

    <!-- Button -->
    <div class="row mb-3">
        <div class="col-4 widget-label">
            <label>버튼:</label>
        </div>
        <div class="col-8">
            <button class="btn btn-primary w-100" id="btnClick">Click Button</button>
        </div>
    </div>

    <!-- Checkbox -->
    <div class="row mb-3">
        <div class="col-4 widget-label">
            <label>Checkbox:</label>
        </div>
        <div class="col-8 d-flex align-items-center">
            <div class="form-check">
                <input class="form-check-input" type="checkbox" id="chkBox">
                <label class="form-check-label" for="chkBox">Check me</label>
            </div>
        </div>
    </div>

    <!-- Dropdown -->
    <div class="row mb-3">
        <div class="col-4 widget-label">
            <label>Dropdown:</label>
        </div>
        <div class="col-8">
            <select class="form-select" id="dropdown">
                <option selected>Option 1</option>
                <option>Option 2</option>
                <option>Option 3</option>
            </select>
        </div>
    </div>

    <!-- TextEdit -->
    <div class="row mb-3">
        <div class="col-4 widget-label widget-label-top">
            <label>TextEdit:</label>
        </div>
        <div class="col-8">
            <textarea class="form-control" id="textEdit" rows="5">
English
한국어
日本語
            </textarea>
        </div>
    </div>

    <!-- Slider -->
    <div class="row mb-3">
        <div class="col-4 widget-label">
            <label>Slider:</label>
        </div>
        <div class="col-8 d-flex align-items-center">
            <input type="range" class="form-range" id="slider" min="0" max="100" value="50">
        </div>
    </div>

    <!-- ListView -->
    <div class="row mb-3">
        <div class="col-4 widget-label widget-label-top">
            <label>ListView:</label>
        </div>
        <div class="col-8">
            <ul class="list-group" id="listView">
                <li class="list-group-item list-group-item-action">Item A</li>
                <li class="list-group-item list-group-item-action">Item B</li>
                <li class="list-group-item list-group-item-action">Item C</li>
            </ul>
        </div>
    </div>

    <!-- Status Label -->
    <div class="row mt-4">
        <div class="col-12 text-center">
            <span id="statusLabel" class="text-muted">Status display area</span>
        </div>
    </div>

</div>

<script>
    const status = document.getElementById('statusLabel')

    function setStatus(text) {
        status.textContent = text
    }

    // pywebview API가 준비될 때까지 대기
    window.addEventListener('pywebviewready', () => {

        // Button
        document.getElementById('btnClick').addEventListener('click', async () => {
            const result = await pywebview.api.on_button_clicked()
            setStatus(result)
        })

        // Checkbox
        document.getElementById('chkBox').addEventListener('change', async (e) => {
            const result = await pywebview.api.on_checkbox_changed(e.target.checked)
            setStatus(result)
        })

        // Dropdown
        document.getElementById('dropdown').addEventListener('change', async (e) => {
            const result = await pywebview.api.on_dropdown_changed(e.target.value)
            setStatus(result)
        })

        // Slider
        document.getElementById('slider').addEventListener('input', async (e) => {
            const result = await pywebview.api.on_slider_changed(e.target.value)
            setStatus(result)
        })

        // ListView
        document.querySelectorAll('#listView .list-group-item').forEach(item => {
            item.addEventListener('click', (e) => {
                document.querySelectorAll('#listView .list-group-item').forEach(i => i.classList.remove('active'))
                e.target.classList.add('active')
                setStatus(`Selected item: ${e.target.textContent}`)
            })
        })
    })
</script>
</body>
</html>
